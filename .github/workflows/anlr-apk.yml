name: ANLR Android APK

on:
  workflow_dispatch:
  push:
    branches: [anlr/separate-linux-runtime]
    paths:
      - 'runtime-app/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'

permissions:
  contents: read

jobs:
  runtime-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build independent runtime APK
        run: ./gradlew --no-daemon :runtime-app:testDebugUnitTest :runtime-app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: anlr-debug-apk
          path: runtime-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

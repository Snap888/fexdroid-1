name: ANLR Android APK

on:
  workflow_dispatch:
  push:
    branches: [anlr/separate-linux-runtime]
    paths:
      - 'runtime-app/**'
      - 'scripts/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/anlr-apk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null
          "$SDKM" --install "platform-tools" "ndk;29.0.14206865" "cmake;3.22.1" >/dev/null
          "$SDKM" --install "platforms;android-37" >/dev/null || true
      - name: Validate ANLR payload build script syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Validate pinned release trust anchor
        env:
          RELEASE_PUBLIC_KEY_B64: ${{ secrets.ANLR_RELEASE_PUBLIC_KEY_B64 }}
          RELEASE_KEY_ID: ${{ secrets.ANLR_RELEASE_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_PUBLIC_KEY_B64"
          test -n "$RELEASE_KEY_ID"
          printf '%s' "$RELEASE_PUBLIC_KEY_B64" | base64 -d > "$RUNNER_TEMP/anlr-release-public.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/anlr-release-public.der" -noout
      - name: Build independent runtime APK
        env:
          ORG_GRADLE_PROJECT_ANLR_RELEASE_PUBLIC_KEY_B64: ${{ secrets.ANLR_RELEASE_PUBLIC_KEY_B64 }}
          ORG_GRADLE_PROJECT_ANLR_RELEASE_KEY_ID: ${{ secrets.ANLR_RELEASE_KEY_ID }}
        run: ./gradlew --no-daemon --stacktrace :runtime-app:testDebugUnitTest :runtime-app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: anlr-debug-apk
          path: runtime-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

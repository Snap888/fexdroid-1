name: ANLR Linux runtime payload

on:
  workflow_dispatch:
  push:
    branches: [anlr/separate-linux-runtime]
    paths:
      - 'scripts/**'
      - 'patches/**'
      - 'third_party/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/anlr-payload.yml'

permissions:
  contents: write

concurrency:
  group: anlr-payload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      FEXROOT_PATH: /data/data/org.anlr.linuxruntime/files/rootfs
      BOX64_TAG: v0.4.4
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Host build dependencies
        run: |
          sudo apt-get update -qq
          docker info >/dev/null
          sudo apt-get install -y ninja-build patchelf zstd bison flex file libarchive-tools gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu glslang-tools ccache
          sudo pip3 install --break-system-packages -q 'meson>=1.4' mako pyyaml packaging
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 >/dev/null
          sudo apt-get install -y libclang-cpp22-dev libclang-22-dev llvm-22-dev lld-22
          for f in /usr/lib/llvm-22/bin/*; do sudo ln -sf "$f" /usr/local/bin/$(basename "$f"); done
          clang --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Validate build scripts
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find scripts -type f -name '*.sh' -exec chmod +x {} +

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: anlr-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: anlr-ccache-${{ runner.os }}-

      - name: Cache Debian rootfs and sysroots
        id: rootfs
        uses: actions/cache@v4
        with:
          path: build/rootfs
          key: anlr-rootfs-v1-${{ hashFiles('scripts/build-rootfs.sh', 'scripts/build-x86-sysroot.sh', 'scripts/build-ubuntu-rootfs.sh', 'scripts/config.sh') }}

      - name: Cache patched glibc
        id: glibc
        uses: actions/cache@v4
        with:
          path: build/glibc/install
          key: anlr-glibc-v1-${{ hashFiles('scripts/build-glibc.sh', 'scripts/config.sh', 'patches/glibc/**', 'scripts/lib/make-glibc*', 'scripts/lib/gen-android-seccomp.py', 'third_party/aosp-bionic-seccomp/**', 'tools/fxshmd/*.h') }}

      - name: Build ARM64 and x86-64 rootfs/sysroots
        if: steps.rootfs.outputs.cache-hit != 'true'
        run: bash scripts/build-rootfs.sh && bash scripts/build-x86-sysroot.sh && bash scripts/build-ubuntu-rootfs.sh

      - name: Build ANLR patched glibc
        if: steps.glibc.outputs.cache-hit != 'true'
        run: bash scripts/build-glibc.sh 2>&1 | tail -50

      - name: Verify pinned LLVM toolchain
        run: |
          clang --version | head -1
          llvm-config --version
          test -f /usr/lib/llvm-22/lib/cmake/clang/ClangConfig.cmake
          test -f /usr/lib/llvm-22/lib/cmake/llvm/LLVMConfig.cmake

      - name: Build FEX and thunks
        run: bash scripts/build-fex.sh 2>&1 | tail -60

      - name: Build Box64 ARM64 dynarec backend
        run: bash scripts/build-box64.sh 2>&1 | tail -60

      - name: Assemble and QEMU smoke-test runtime
        run: |
          ANLR_PREBUILT_STAGES=1 BUILD_MESA=0 bash scripts/build-anlr-payload.sh

      - name: Sign Debian and Ubuntu manifests
        id: sign
        env:
          RELEASE_PRIVATE_KEY_B64: \${{ secrets.ANLR_RELEASE_PRIVATE_KEY_B64 }}
          RELEASE_PUBLIC_KEY_B64: \${{ secrets.ANLR_RELEASE_PUBLIC_KEY_B64 }}
          RELEASE_KEY_ID: \${{ secrets.ANLR_RELEASE_KEY_ID }}
          RELEASE_TAG: anlr-runtime-\${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "\${RELEASE_PRIVATE_KEY_B64:-}" || -z "\${RELEASE_PUBLIC_KEY_B64:-}" || -z "\${RELEASE_KEY_ID:-}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release secrets incomplete; keeping build as CI-only artifact."
            exit 0
          fi
          mkdir -p build/anlr-release/signed
          printf '%s' "$RELEASE_PRIVATE_KEY_B64" | base64 -d > build/anlr-release/release-key.pem
          openssl pkey -in build/anlr-release/release-key.pem -noout >/dev/null
          DER_PUBLIC="$(openssl pkey -in build/anlr-release/release-key.pem -pubout -outform DER | base64 -w0)"
          [[ "$DER_PUBLIC" == "$RELEASE_PUBLIC_KEY_B64" ]] || {
            echo "Configured public key does not match private release key." >&2
            exit 1
          }
          python3 - "$RELEASE_KEY_ID" "$RELEASE_TAG" <<'PY'
          import json, pathlib, sys
          key_id, tag = sys.argv[1:]
          out = pathlib.Path("build/anlr-release")
          for distro, version, slug in (("Debian", "Trixie", "debian"), ("Ubuntu", "24.04", "ubuntu")):
              meta = json.loads((out / f"{slug}-archive-metadata.json").read_text())
              manifest = {
                  "schemaVersion": 1,
                  "keyId": key_id,
                  "releaseId": f"{slug}-{version.lower()}-{tag[-12:]}",
                  "architecture": "aarch64",
                  "distribution": distro,
                  "distributionVersion": version,
                  "runtimeAbi": "anlr-glibc-v1",
                  "archiveFormat": "tar.gz",
                  "downloadUrl": f"https://github.com/Snap888/fexdroid-1/releases/download/{tag}/{slug}-arm64-rootfs.tar.gz",
                  "archiveSizeBytes": meta["archiveSizeBytes"],
                  "expandedSizeBytes": meta["expandedSizeBytes"],
                  "archiveSha256": meta["archiveSha256"]
              }
              (out / "signed" / f"{slug}-manifest.json").write_text(json.dumps(manifest, separators=(",", ":")) + "\n")
          PY
          for distro in debian ubuntu; do
            openssl pkeyutl -sign -rawin -inkey build/anlr-release/release-key.pem \
              -in "build/anlr-release/signed/$distro-manifest.json" \
              -out "build/anlr-release/signed/$distro-manifest.sig.bin"
            base64 -w0 "build/anlr-release/signed/$distro-manifest.sig.bin" > "build/anlr-release/signed/$distro-manifest.sig"
          done
          rm -f build/anlr-release/release-key.pem build/anlr-release/signed/*.sig.bin
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Publish signed Debian and Ubuntu runtime
        if: steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anlr-runtime-\${{ github.sha }}
          name: ANLR Linux Runtime \${{ github.sha }}
          make_latest: true
          files: |
            build/anlr-release/debian-arm64-rootfs.tar.gz
            build/anlr-release/ubuntu-arm64-rootfs.tar.gz
            build/anlr-release/signed/debian-manifest.json
            build/anlr-release/signed/debian-manifest.sig
            build/anlr-release/signed/ubuntu-manifest.json
            build/anlr-release/signed/ubuntu-manifest.sig

      - uses: actions/upload-artifact@v4
        with:
          name: anlr-linux-runtime-${{ github.sha }}
          path: |
            build/anlr-release/debian-arm64-rootfs.tar.gz
            build/anlr-release/debian-archive-metadata.json
            build/anlr-release/ubuntu-arm64-rootfs.tar.gz
            build/anlr-release/ubuntu-archive-metadata.json
            build/box64/version.txt
            build/fex/install/data/data/org.anlr.linuxruntime/files/rootfs/usr/bin/FEX
          if-no-files-found: error
          compression-level: 0
